name: data

on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - "src/db/**"
      - "src/lib/**"
      - "drizzle/**"
      - "package*.json"
  pull_request:

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Rebuild the database from the workbook
        run: npm run import
      - name: Validate (fails on unacknowledged errors)
        run: npm run validate
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
