# Player birth dates
# =================
# One entry per player id (see data/overrides/players.yaml for ids). Re-run
# `npm run import` after editing. Players joined by a `people:` entry share a
# date: set it on one row and the importer copies it to the others.
#
#   born:    "YYYY-MM-DD", "YYYY-MM" or "YYYY" - keep whatever precision the
#            source actually gives.
#   approx:  true when the year was inferred from an age or a school class
#            rather than read from a record (shown as "c. 1995").
#   band:    instead of `born`, when only an age band is known: "u25",
#            "25-29", "30-39", "40-49" or "50+" (bands in src/lib/ages.ts),
#            with `asOf: <year>` for the year it was true in.
#   source:  where it came from, in a few words.
#
# Dates were taken from the clubs' age rosters (08.15.25 Diebold Ages.xlsx)
# on 14 Oct 2026; the rest were found in public college rosters, tour bios
# and news reports the same day. Players on those rosters with no date and
# nothing findable are listed at the bottom so nobody searches twice.

