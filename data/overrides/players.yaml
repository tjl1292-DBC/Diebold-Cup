# Player identity overrides
# =========================
# Edit this file to fix misattributions without touching code, then re-run
# `npm run import`. Three sections:
#
#   players:  define or adjust a player. `id` is the URL slug and must be
#             stable once published. Anything you set here beats what the
#             resolver would have inferred.
#   aliases:  pin a spelling (as written on the sheet) to a player id. Scoped
#             to a club; optionally to a year range. Overrides beat every
#             automatic rule.
#   people:   join Player rows at different clubs that are the same human.
#
# The resolver's own decisions, with confidence and reasons, are written to
# reports/player-resolution.md after every import.
#
# How names are resolved automatically (in order):
#   1. an alias rule here
#   2. exact full name (after nickname folding: Tom/Tommy/Thomas, Pat/Patrick,
#      Mike/Michael, Jim/James/Jimmy, Jon/John/Jonathan, Dave/David, Sean/Shawn ...)
#   3. a suffix-less full name merges into a suffixed one when there is exactly
#      one candidate (John Marous -> John Marous III)
#   4. initial + surname ("J. Thomas") -> the player with that surname and
#      initial whose seasons are closest to the row's year
#   5. surname only ("Thomas") -> the player with that surname whose seasons
#      are closest to the row's year, ties broken by most appearances
#   6. otherwise a new player is created from whatever was written
#
# Club ids: field-club, fox-chapel, oakmont, longue-vue, allegheny
# Answers below were confirmed by Tommy on 18 Sep 2026 (review page).

players:
  - id: oakmont-jim-sullivan-jr
    club: oakmont
    displayName: Jim Sullivan Jr.
    givenName: Jim
    surname: Sullivan
    suffix: Jr
    note: "Appears on the sheets as Jim Sullivan Jr, J. Sullivan Jr., Sullivan Jr. and plain Jim Sullivan / J. Sullivan / Sullivan."

  - id: oakmont-jim-sullivan-sr
